<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pháp Môn Tâm Linh 心靈法門</title>
    <link rel="icon" href="logo.png" type="image/png">
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DQWQTWXMZL"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-DQWQTWXMZL');
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#F9F7F2',
                        ink: '#5D2E2E',
                        clay: '#8C4A4A',
                        clayHover: '#7A3E3E',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'paper': '0 4px 20px -2px rgba(93, 46, 46, 0.1)',
                        'float': '0 10px 30px -5px rgba(140, 74, 74, 0.4)',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: theme('colors.paper'); color: theme('colors.ink'); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: theme('colors.clay'); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: theme('colors.clayHover'); }

        .loader {
            border: 3px solid rgba(140, 74, 74, 0.2);
            border-top: 3px solid theme('colors.clay');
            border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        input[type=range] { -webkit-appearance: none; background: theme('colors.paper'); border-radius: 8px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%;
            background: theme('colors.clay'); cursor: pointer; box-shadow: theme('boxShadow.float'); transition: transform 0.2s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.1); }
    </style>
</head>

<body class="font-sans antialiased fixed inset-0 w-full flex flex-col overflow-hidden bg-paper">

    <main class="flex-grow w-full max-w-5xl mx-auto p-4 md:p-8 pb-2 md:pb-4 flex flex-col overflow-hidden">
        
        <header class="flex-none mb-4 md:mb-6 w-full flex flex-col md:flex-row justify-between items-center md:items-start gap-4 md:gap-0 mt-2">
            <div class="w-full md:w-auto flex justify-end items-center md:order-2 gap-3">
                <select id="model-select" class="bg-white border border-clay/20 text-ink/80 text-xs md:text-sm rounded-full px-3 py-2 outline-none focus:border-clay shadow-sm w-40 md:w-56 truncate cursor-pointer transition-all duration-300">
                    <option value="">Đang tải Model...</option>
                </select>

                <a href="/api/logout" class="group flex items-center gap-2 px-4 py-2 bg-white rounded-full shadow-sm hover:shadow-paper border border-transparent hover:border-clay/20 transition-all duration-300">
                    <span class="text-sm font-semibold text-ink/80 group-hover:text-clay">Thoát</span>
                    <i class="fa-solid fa-arrow-right-from-bracket text-clay text-sm"></i>
                </a>
            </div>
            <div class="text-center md:text-left md:order-1 flex-1">
                <h1 class="text-2xl md:text-3xl font-bold text-ink mb-1 md:mb-2">Pháp Môn Tâm Linh 心靈法門</h1>
                <p class="text-sm md:text-base text-ink/70">Chuyển đổi văn bản thành giọng nói mượt mà</p>
            </div>
        </header>

        <div id="error-container" class="flex-none hidden w-full mx-auto p-4 mb-4 bg-red-50 border border-red-200 text-red-600 rounded-2xl shadow-sm transition-all duration-300">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-circle-exclamation"></i>
                <p id="error-message" class="text-sm font-medium"></p>
            </div>
        </div>

        <div class="flex-grow w-full mx-auto bg-white rounded-[2rem] md:rounded-3xl shadow-paper p-4 transition-all duration-300 flex flex-col overflow-hidden">
            <div class="flex flex-wrap justify-between items-center mb-4 gap-2 border-b border-paper pb-3">
                <div class="flex gap-2">
                    <button id="add-block-btn" class="text-xs md:text-sm bg-clay text-white px-3 md:px-4 py-2 rounded-xl hover:shadow-float hover:-translate-y-0.5 transition-all flex items-center">
                        <i class="fa-solid fa-plus mr-1.5"></i> Thêm đoạn
                    </button>
                    <button id="auto-split-btn" class="text-xs md:text-sm bg-paper text-ink border border-clay/20 px-3 md:px-4 py-2 rounded-xl hover:bg-clay hover:text-white transition-all flex items-center">
                        <i class="fa-solid fa-scissors mr-1.5"></i> Cắt tự động
                    </button>
                </div>
                <div class="flex gap-3 items-center">
                    <button id="clear-text-btn" title="Xóa toàn bộ văn bản" class="text-ink/40 hover:text-red-500 p-2 rounded-xl transition-all hover:bg-red-50">
                        <i class="fa-solid fa-trash-can text-lg"></i> Xóa hết
                    </button>
                    <div id="char-counter" class="font-mono text-xs md:text-sm text-ink/50 bg-paper px-2 py-1 rounded-lg">
                        0 / 15000
                    </div>
                </div>
            </div>

            <div id="blocks-container" class="w-full flex-grow overflow-y-auto pr-2 space-y-3 pb-4">
                </div>
        </div>
    </main>

    <footer class="flex-none w-full md:w-auto md:max-w-4xl mx-auto z-40 px-4 md:px-0" style="padding-bottom: max(1rem, env(safe-area-inset-bottom));">
        <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-float border border-paper p-2 md:p-3 flex flex-col md:flex-row items-center gap-3 transition-all duration-300">
            
            <div id="player-container" style="display: none;" class="w-full md:w-auto md:min-w-[320px] flex-1 items-center gap-2 md:gap-3 p-1 md:p-2 bg-paper rounded-2xl">
                <audio id="audio-player" controls class="w-full h-10 outline-none"></audio>
                <button id="download-btn" title="Tải xuống" 
                    class="h-10 w-10 md:h-12 md:w-12 bg-clay text-white rounded-xl shadow-sm hover:shadow-float hover:-translate-y-1 active:scale-95 transition-all duration-300 flex items-center justify-center flex-shrink-0">
                    <i class="fa-solid fa-download"></i>
                </button>
            </div>

            <div class="flex items-center justify-between md:justify-center w-full md:w-auto gap-1 md:gap-4 px-1">
                
                <button id="open-voice-modal-btn" title="Giọng mặc định cho đoạn mới" class="flex flex-col items-center justify-center py-2 px-2 md:px-3 rounded-2xl hover:bg-paper text-ink transition-all duration-300 min-w-[64px] md:min-w-[72px]">
                    <i class="fa-solid fa-user-pen text-lg md:text-xl mb-1 text-clay"></i>
                    <span id="selected-voice-name" class="text-[9px] md:text-[10px] font-semibold uppercase tracking-wider text-center leading-tight">Mặc định:<br>Kore</span>
                </button>

                <button id="optimize-button" title="Tối ưu hóa văn bản (Sẽ gộp tất cả đoạn)" 
                    class="flex items-center justify-center h-10 w-10 md:h-12 md:w-12 bg-paper text-ink rounded-full shadow-sm hover:bg-clay hover:text-white transition-all duration-300 hover:-translate-y-1">
                    <i id="optimize-icon" class="fa-solid fa-magic-wand-sparkles text-sm md:text-base"></i>
                    <div id="optimize-loader" class="loader hidden !w-5 !h-5 border-2"></div>
                </button>

                <button id="generate-button" 
                    class="flex items-center justify-center h-14 w-14 md:h-16 md:w-16 bg-clay text-white rounded-full shadow-float hover:-translate-y-1 active:scale-95 transition-all duration-300 relative group mx-1 md:mx-0">
                    <i id="generate-icon" class="fa-solid fa-play text-xl md:text-2xl ml-1 group-hover:scale-110 transition-transform duration-300"></i>
                    <div id="generate-loader" class="loader hidden border-white/30 border-t-white"></div>
                </button>

                <button id="open-speed-modal-btn" class="flex flex-col items-center justify-center py-2 px-2 md:px-3 rounded-2xl hover:bg-paper text-ink transition-all duration-300 min-w-[64px] md:min-w-[72px]">
                    <i class="fa-solid fa-gauge-high text-lg md:text-xl mb-1 text-clay"></i>
                    <span id="speed-value-display" class="font-mono text-[10px] md:text-[11px] font-semibold">1.0x</span>
                </button>
            </div>
        </div>
    </footer>
    
    <div id="voice-modal" class="fixed inset-0 bg-ink/40 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50 transition-all duration-300">
        <div class="bg-white rounded-3xl shadow-float w-full max-w-md max-h-[85vh] flex flex-col overflow-hidden">
            <div class="flex items-center justify-between p-5 border-b border-paper">
                <h2 class="text-lg font-bold text-ink">Chọn giọng đọc mặc định</h2>
                <button id="close-voice-modal-btn" class="p-2 rounded-full text-ink/50 hover:text-clay hover:bg-paper transition-all duration-300">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div id="voice-list" class="p-4 space-y-2 overflow-y-auto"></div>
        </div>
    </div>

    <div id="speed-modal" class="fixed inset-0 bg-ink/40 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50 transition-all duration-300">
        <div class="bg-white rounded-3xl shadow-float w-full max-w-sm overflow-hidden">
            <div class="flex items-center justify-between p-5 border-b border-paper">
                <h2 class="text-lg font-bold text-ink">Tốc độ đọc chung</h2>
                <span id="speed-modal-value" class="font-mono font-bold text-clay bg-paper px-3 py-1 rounded-lg">1.0x</span>
            </div>
            <div class="p-8">
                <input type="range" id="speed-slider" min="0.5" max="2.0" value="1.0" step="0.1" class="w-full h-2">
                <div class="flex justify-between text-xs font-mono text-ink/50 mt-4">
                    <span>0.5x</span>
                    <span>1.0x</span>
                    <span>2.0x</span>
                </div>
            </div>
            <div class="p-4 bg-paper/50 flex justify-end">
                <button id="confirm-speed-btn" class="bg-clay text-white font-medium py-2.5 px-8 rounded-2xl shadow-float hover:-translate-y-1 active:scale-95 transition-all duration-300">
                    Xác nhận
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const MAX_CHARS = 15000;
            const voices = [
                { id: 'Kore', name: 'Kore', description: 'Giọng nữ, trang trọng', gender: 'female' },
                { id: 'Puck', name: 'Puck', description: 'Giọng nam, vui vẻ', gender: 'male' },
                { id: 'Charon', name: 'Charon', description: 'Giọng nam, truyền cảm', gender: 'male' },
                { id: 'Alnilam', name: 'Alnilam', description: 'Giọng nam, chắc chắn', gender: 'male' },
                { id: 'Zephyr', name: 'Zephyr', description: 'Giọng nữ, tươi sáng', gender: 'female' },
                { id: 'Leda', name: 'Leda', description: 'Giọng nữ, trẻ trung', gender: 'female' },
                { id: 'Aoede', name: 'Aoede', description: 'Giọng nữ, nhẹ nhàng', gender: 'female' },
                { id: 'Schedar', name: 'Schedar', description: 'Giọng nam, điềm đạm', gender: 'male' }
            ];
            let defaultVoiceId = voices[0].id;
            let generatedAudioBlob = null;
            let currentSpeed = 1.0;

            const blocksContainer = document.getElementById('blocks-container');
            const addBlockBtn = document.getElementById('add-block-btn');
            const autoSplitBtn = document.getElementById('auto-split-btn');
            const clearTextBtn = document.getElementById('clear-text-btn');
            
            const modelSelect = document.getElementById('model-select');
            const charCounter = document.getElementById('char-counter');
            const generateButton = document.getElementById('generate-button');
            const generateIcon = document.getElementById('generate-icon');
            const generateLoader = document.getElementById('generate-loader');
            const downloadBtn = document.getElementById('download-btn');
            const audioPlayer = document.getElementById('audio-player');
            const playerContainer = document.getElementById('player-container');
            const voiceModal = document.getElementById('voice-modal');
            const openVoiceModalBtn = document.getElementById('open-voice-modal-btn');
            const closeVoiceModalBtn = document.getElementById('close-voice-modal-btn');
            const voiceListContainer = document.getElementById('voice-list');
            const selectedVoiceNameSpan = document.getElementById('selected-voice-name');
            const speedModal = document.getElementById('speed-modal');
            const openSpeedModalBtn = document.getElementById('open-speed-modal-btn');
            const confirmSpeedBtn = document.getElementById('confirm-speed-btn');
            const speedSlider = document.getElementById('speed-slider');
            const speedModalValue = document.getElementById('speed-modal-value');
            const speedValueDisplay = document.getElementById('speed-value-display');
            const errorContainer = document.getElementById('error-container');
            const errorMessage = document.getElementById('error-message');
            const optimizeButton = document.getElementById('optimize-button');
            const optimizeIcon = document.getElementById('optimize-icon');
            const optimizeLoader = document.getElementById('optimize-loader');

            // --- LẤY TOÀN BỘ VĂN BẢN TỪ CÁC KHỐI ---
            const getAllText = () => {
                const textareas = document.querySelectorAll('.block-text');
                return Array.from(textareas).map(ta => ta.value.trim()).filter(t => t).join('\n\n');
            };

            // --- ĐẾM SỐ KÝ TỰ TỔNG ---
            const updateCharCounter = () => { 
                const textareas = document.querySelectorAll('.block-text');
                let count = Array.from(textareas).reduce((acc, ta) => acc + ta.value.length, 0);
                charCounter.textContent = `${count} / ${MAX_CHARS}`; 
                if (count >= MAX_CHARS) { charCounter.classList.add('text-clay', 'font-bold'); } 
                else { charCounter.classList.remove('text-clay', 'font-bold'); } 
            };

            // --- QUẢN LÝ KHỐI HỘI THOẠI (BLOCKS) ---
            const getVoiceOptionsHTML = (selectedVoiceId) => {
                return voices.map(v => 
                    `<option value="${v.id}" ${v.id === selectedVoiceId ? 'selected' : ''}>
                        ${v.name} (${v.gender === 'male' ? 'Nam' : 'Nữ'})
                    </option>`
                ).join('');
            };

            const createBlock = (text = '', voiceId = defaultVoiceId) => {
                const block = document.createElement('div');
                block.className = 'tts-block relative bg-paper p-3 md:p-4 rounded-[1.25rem] border border-transparent focus-within:border-clay/40 transition-all shadow-sm';
                block.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <select class="block-voice bg-white text-xs border border-clay/20 rounded-lg px-2 py-1.5 outline-none text-ink font-medium shadow-sm cursor-pointer hover:border-clay/50 transition-all">
                            ${getVoiceOptionsHTML(voiceId)}
                        </select>
                        <button class="remove-block-btn text-ink/30 hover:text-red-500 hover:bg-white p-1.5 rounded-lg transition-all" title="Xóa đoạn này">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                    <textarea class="block-text w-full bg-transparent text-ink outline-none resize-none text-[15px] md:text-base leading-relaxed min-h-[60px]" placeholder="Nhập văn bản cho đoạn này..."></textarea>
                `;
                
                const textarea = block.querySelector('.block-text');
                textarea.value = text;
                
                // Tự động thay đổi chiều cao
                const resizeTextarea = () => {
                    textarea.style.height = 'auto';
                    textarea.style.height = (textarea.scrollHeight) + 'px';
                };
                textarea.addEventListener('input', () => {
                    resizeTextarea();
                    updateCharCounter();
                });
                
                // Xóa khối
                block.querySelector('.remove-block-btn').addEventListener('click', () => {
                    if (document.querySelectorAll('.tts-block').length > 1) {
                        block.remove();
                        updateCharCounter();
                    } else {
                        textarea.value = '';
                        updateCharCounter();
                    }
                });

                blocksContainer.appendChild(block);
                setTimeout(resizeTextarea, 0); // Kích hoạt resize ban đầu
            };

            // Hàm tự động chia đoạn
            const doAutoSplit = (textToSplit) => {
                if (!textToSplit) return;
                
                // Tách theo dấu chấm, chấm hỏi, chấm than, hoặc xuống dòng
                const chunks = textToSplit.match(/[^.!?\n]+[.!?\n]+/g) || [textToSplit];
                
                blocksContainer.innerHTML = ''; // Xóa sạch khối cũ
                
                let voiceNam = voices.find(v => v.gender === 'male').id;
                let voiceNu = voices.find(v => v.gender === 'female').id;

                chunks.forEach((chunk, index) => {
                    const text = chunk.trim();
                    if (text) {
                        // Luân phiên giọng nam/nữ
                        const isEven = index % 2 === 0;
                        const blockVoice = isEven ? voiceNu : voiceNam;
                        createBlock(text, blockVoice);
                    }
                });
                updateCharCounter();
            };

            addBlockBtn.addEventListener('click', () => {
                createBlock();
                blocksContainer.scrollTop = blocksContainer.scrollHeight;
            });

            autoSplitBtn.addEventListener('click', () => {
                const fullText = getAllText();
                if (!fullText) {
                    showError("Vui lòng nhập văn bản vào để chia đoạn.");
                    return;
                }
                doAutoSplit(fullText);
            });

            clearTextBtn.addEventListener('click', () => {
                blocksContainer.innerHTML = '';
                createBlock();
                updateCharCounter();
            });

            // --- CÁC HÀM TIỆN ÍCH ---
            const loadModels = async () => {
                try {
                    const res = await fetch('/api/models');
                    const data = await res.json();
                    if (data.models && data.models.length > 0) {
                        modelSelect.innerHTML = '';
                        data.models.forEach(model => {
                            const option = document.createElement('option');
                            option.value = model;
                            option.textContent = model;
                            if (model.includes('tts')) option.selected = true;
                            modelSelect.appendChild(option);
                        });
                    } else {
                        modelSelect.innerHTML = '<option value="">Không có Model</option>';
                    }
                } catch (e) {
                    modelSelect.innerHTML = '<option value="gemini-2.5-flash-preview-tts">Lỗi tải, dùng mặc định</option>';
                }
            };
            loadModels(); 
            
            const showError = (message) => { 
                if (message) { 
                    let displayMessage = message; 
                    const lowerCaseMessage = message.toLowerCase(); 
                    if (lowerCaseMessage.includes('quota')) { displayMessage = "Bạn đã dùng hết lượt miễn phí. Vui lòng thử lại sau."; } 
                    else if (lowerCaseMessage.includes('504') || lowerCaseMessage.includes('timeout')) { displayMessage = "Yêu cầu xử lý quá lâu. Vui lòng thử lại với đoạn văn ngắn hơn."; } 
                    if (lowerCaseMessage.includes('phiên đăng nhập hết hạn')) {
                        displayMessage = "Phiên đăng nhập đã hết hạn. Hệ thống sẽ chuyển hướng sau 2 giây.";
                        setTimeout(() => window.location.href = '/login', 2000);
                    }
                    errorMessage.textContent = displayMessage; 
                    errorContainer.classList.remove('hidden'); 
                } else { 
                    errorContainer.classList.add('hidden'); 
                } 
            };
            
            const toggleLoading = (isLoading, context = 'generate') => { 
                if (context === 'generate') { 
                    generateIcon.classList.toggle('hidden', isLoading); 
                    generateLoader.classList.toggle('hidden', !isLoading); 
                    generateButton.disabled = isLoading; 
                } else if (context === 'optimize') { 
                    optimizeIcon.classList.toggle('hidden', isLoading); 
                    optimizeLoader.classList.toggle('hidden', !isLoading); 
                    optimizeButton.disabled = isLoading; 
                } 
            };
            
            const createVoiceList = () => { 
                voiceListContainer.innerHTML = ''; 
                voices.forEach(voice => { 
                    const isSelected = voice.id === defaultVoiceId; 
                    const voiceElement = document.createElement('div'); 
                    voiceElement.className = `flex items-center justify-between p-4 rounded-2xl cursor-pointer transition-all duration-300 border border-transparent ${isSelected ? 'bg-paper border-clay shadow-sm ring-1 ring-clay/20' : 'bg-white hover:bg-paper'}`; 
                    voiceElement.dataset.voiceId = voice.id; 
                    voiceElement.innerHTML = `<div class="flex items-center flex-grow"><i class="fa-solid ${voice.gender === 'male' ? 'fa-mars' : 'fa-venus'} text-ink/40 w-8 text-lg text-center"></i><div><div class="font-semibold ${isSelected ? 'text-clay' : 'text-ink'}">${voice.name}</div><div class="text-xs text-ink/60 mt-0.5">${voice.description}</div></div></div><div class="w-5 text-center">${isSelected ? '<i class="fa-solid fa-circle-check text-clay text-lg"></i>' : ''}</div>`; 
                    voiceListContainer.appendChild(voiceElement); 
                }); 
            };

            // 1. Hàm cắt đoạn nội bộ (Đề phòng 1 khối quá dài > 800 ký tự)
            const splitTextIntoChunks = (text, maxLength = 800) => {
                const paragraphs = text.split(/\n+/);
                const chunks = [];
                let currentChunk = '';
                for (const para of paragraphs) {
                    if (!para.trim()) continue;
                    if ((currentChunk + '\n' + para).length > maxLength && currentChunk.length > 0) {
                        chunks.push(currentChunk.trim());
                        currentChunk = para;
                    } else {
                        currentChunk = currentChunk ? currentChunk + '\n' + para : para;
                    }
                }
                if (currentChunk.trim()) chunks.push(currentChunk.trim());
                return chunks;
            };

            // 2. Hàm chuyển Base64 sang nhị phân
            const base64ToUint8Array = (base64) => {
                const binaryString = window.atob(base64);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                return bytes;
            };

            // 3. Hàm nén MP3
            const pcmToMp3 = (pcmUint8Array, sampleRate) => {
                const validByteLength = pcmUint8Array.byteLength - (pcmUint8Array.byteLength % 2);
                const int16Samples = new Int16Array(pcmUint8Array.buffer, 0, validByteLength / 2);
                
                const mp3encoder = new lamejs.Mp3Encoder(1, sampleRate, 128); 
                const mp3Data = [];
                const sampleBlockSize = 1152; 
                
                for (let i = 0; i < int16Samples.length; i += sampleBlockSize) {
                    const sampleChunk = int16Samples.subarray(i, i + sampleBlockSize);
                    const mp3buf = mp3encoder.encodeBuffer(sampleChunk);
                    if (mp3buf.length > 0) {
                        mp3Data.push(new Int8Array(mp3buf));
                    }
                }
                const mp3buf = mp3encoder.flush();
                if (mp3buf.length > 0) {
                    mp3Data.push(new Int8Array(mp3buf));
                }
                return new Blob(mp3Data, { type: 'audio/mp3' });
            };

            // 4. Hàm Gọi API Audio
            const callSpeechAPI = async (text, voiceId, rate) => { 
                const maxRetries = 3; 
                const retryDelay = 2000; 
                for (let i = 0; i < maxRetries; i++) { 
                    try { 
                        const response = await fetch('/api/generate-speech', { 
                            method: 'POST', 
                            headers: { 'Content-Type': 'application/json' }, 
                            body: JSON.stringify({ text, voice: voiceId, rate, model: modelSelect.value }) 
                        });
                        const responseText = await response.text(); 
                        if (!response.ok) { 
                            try { const errorJson = JSON.parse(responseText); throw new Error(errorJson.error || responseText); } 
                            catch (e) { throw new Error(responseText || `Lỗi từ server: ${response.status} ${response.statusText}`); } 
                        } 
                        if (!responseText) { throw new Error("EMPTY_RESPONSE"); } 
                        try { return JSON.parse(responseText); } 
                        catch (e) { throw new Error("Phản hồi thành công nhưng không phải định dạng JSON hợp lệ."); } 
                    } catch (error) { 
                        if (error.message === "EMPTY_RESPONSE" && i < maxRetries - 1) { 
                            await new Promise(resolve => setTimeout(resolve, retryDelay)); 
                        } else { throw error; } 
                    } 
                } 
            };

            // 5. Hàm xử lý duyệt qua toàn bộ các KHỐI
            const handleGenerateSpeech = async () => { 
                const blockElements = document.querySelectorAll('.tts-block');
                const tasks = Array.from(blockElements).map(block => ({
                    text: block.querySelector('.block-text').value.trim(),
                    voiceId: block.querySelector('.block-voice').value
                })).filter(task => task.text !== '');

                if (tasks.length === 0) { showError("Vui lòng nhập văn bản."); return; } 
                
                showError(null); toggleLoading(true); 
                playerContainer.style.display = 'none'; 
                generatedAudioBlob = null;
            
                try { 
                    let finalPcmData = new Uint8Array(0);
                    let finalSampleRate = 24000;
            
                    for (let tIdx = 0; tIdx < tasks.length; tIdx++) {
                        const task = tasks[tIdx];
                        const textChunks = splitTextIntoChunks(task.text);

                        for (let cIdx = 0; cIdx < textChunks.length; cIdx++) {
                            generateLoader.title = `Đang xử lý Khối ${tIdx + 1}/${tasks.length}...`;
                            
                            const response = await callSpeechAPI(textChunks[cIdx], task.voiceId, currentSpeed); 
                            
                            if (response && response.audioContent) {
                                finalSampleRate = response.sampleRate; 
                                const pcmBytes = base64ToUint8Array(response.audioContent);
                                
                                const merged = new Uint8Array(finalPcmData.length + pcmBytes.length);
                                merged.set(finalPcmData);
                                merged.set(pcmBytes, finalPcmData.length);
                                finalPcmData = merged;
                            }
                        }
                    }
            
                    generatedAudioBlob = pcmToMp3(finalPcmData, finalSampleRate);
                    
                    const audioUrl = URL.createObjectURL(generatedAudioBlob); 
                    playerContainer.style.display = 'flex'; 
                    audioPlayer.src = audioUrl; 
                    audioPlayer.play(); 
            
                } catch (error) { 
                    showError(error.message); 
                } 
                finally { 
                    generateLoader.title = "";
                    toggleLoading(false); 
                } 
            };

            // 6. Hàm Tải xuống MP3
            const handleDownload = () => {
                if (!generatedAudioBlob) {
                    alert("Chưa có tệp âm thanh để tải. Vui lòng tạo giọng đọc trước.");
                    return;
                }

                const url = URL.createObjectURL(generatedAudioBlob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                
                const now = new Date();
                const timeString = `${now.getHours()}h${now.getMinutes()}p${now.getSeconds()}s`;
                a.download = `Audio_TTS_${timeString}.mp3`;
                
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 100);
            };

            // Hàm Tối ưu (Gộp -> Tối ưu -> Tự động chia lại)
            const handleOptimizeText = async () => {
                const text = getAllText();
                if (!text) { showError("Vui lòng nhập văn bản để tối ưu hóa."); return; }
                showError(null); toggleLoading(true, 'optimize');
                try {
                    const response = await fetch('/api/optimize-text', { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({ text }) 
                    });
                    const data = await response.json();
                    if (!response.ok || !data.success) { throw new Error(data.error || "Lỗi không xác định khi tối ưu hóa."); }
                    
                    // Chia tự động đoạn văn bản đã được AI tối ưu
                    doAutoSplit(data.optimizedText);
                    
                } catch (error) { showError(error.message); } 
                finally { toggleLoading(false, 'optimize'); }
            };

            // --- SỰ KIỆN GẮN CHO CÁC NÚT ĐIỀU KHIỂN CHUNG ---
            generateButton.addEventListener('click', handleGenerateSpeech);
            downloadBtn.addEventListener('click', handleDownload);
            optimizeButton.addEventListener('click', handleOptimizeText);

            openVoiceModalBtn.addEventListener('click', () => { createVoiceList(); voiceModal.classList.remove('hidden'); });
            closeVoiceModalBtn.addEventListener('click', () => voiceModal.classList.add('hidden'));
            voiceModal.addEventListener('click', (e) => { if (e.target === voiceModal) { voiceModal.classList.add('hidden'); } });
            
            voiceListContainer.addEventListener('click', (e) => { 
                const voiceItem = e.target.closest('[data-voice-id]'); 
                if (voiceItem) { 
                    defaultVoiceId = voiceItem.dataset.voiceId; 
                    selectedVoiceNameSpan.innerHTML = `Mặc định:<br>${voices.find(v => v.id === defaultVoiceId).name}`; 
                    createVoiceList(); 
                    setTimeout(() => voiceModal.classList.add('hidden'), 200); 
                } 
            });
            
            openSpeedModalBtn.addEventListener('click', () => speedModal.classList.remove('hidden'));
            confirmSpeedBtn.addEventListener('click', () => speedModal.classList.add('hidden'));
            speedModal.addEventListener('click', (e) => { if (e.target === speedModal) { speedModal.classList.add('hidden'); } });
            
            speedSlider.addEventListener('input', (e) => { 
                currentSpeed = parseFloat(e.target.value); 
                const speedText = `${currentSpeed.toFixed(1)}x`; 
                speedModalValue.textContent = speedText; 
                speedValueDisplay.textContent = speedText; 
                audioPlayer.playbackRate = currentSpeed; 
            });

            // --- KHỞI TẠO BẮT ĐẦU ---
            createBlock(); // Khởi tạo 1 block rỗng
            selectedVoiceNameSpan.innerHTML = `Mặc định:<br>${voices[0].name}`;
        });
    </script>
</body>
