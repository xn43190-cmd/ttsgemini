<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pháp Môn Tâm Linh 心靈法門 TTS</title>
    <link rel="icon" href="logo.png" type="image/png">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DQWQTWXMZL"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-DQWQTWXMZL');
    </script>
    
    <!-- BOILERPLATE CONFIG -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#F9F7F2',
                        ink: '#5D2E2E',
                        clay: '#8C4A4A',
                        clayHover: '#7A3E3E',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'paper': '0 4px 20px -2px rgba(93, 46, 46, 0.1)',
                        'float': '0 10px 30px -5px rgba(140, 74, 74, 0.4)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: theme('colors.paper');
            color: theme('colors.ink');
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: theme('colors.clay');
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: theme('colors.clayHover');
        }

        /* Custom Loader */
        .loader {
            border: 3px solid rgba(140, 74, 74, 0.2); /* clay with opacity */
            border-top: 3px solid theme('colors.clay');
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        /* Range Slider Customization */
        input[type=range] {
            -webkit-appearance: none;
            background: theme('colors.paper');
            border-radius: 8px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: theme('colors.clay');
            cursor: pointer;
            box-shadow: theme('boxShadow.float');
            transition: transform 0.2s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col">

    <main class="flex-grow w-full max-w-7xl mx-auto p-4 md:p-8 pb-40">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-ink mb-2">Pháp Môn Tâm Linh 心靈法門 TTS</h1>
            <p class="text-ink/70">Chuyển đổi văn bản thành giọng nói mượt mà</p>
        </header>

        <!-- Error Container -->
        <div id="error-container" class="hidden w-full max-w-4xl mx-auto p-4 mb-6 bg-red-50 border border-red-200 text-red-600 rounded-2xl shadow-sm transition-all duration-300">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-circle-exclamation"></i>
                <p id="error-message" class="text-sm font-medium"></p>
            </div>
        </div>

        <!-- Main Editor Card -->
        <div class="w-full max-w-4xl mx-auto bg-white rounded-3xl shadow-paper p-2 md:p-4 transition-all duration-300">
            <div class="relative w-full h-[50vh] md:h-[60vh]">
                <textarea id="text-input" maxlength="15000" 
                    class="w-full h-full p-5 pr-14 bg-paper text-ink border-transparent rounded-2xl focus:ring-2 focus:ring-clay/30 focus:border-transparent transition-all duration-300 resize-none outline-none text-base leading-relaxed" 
                    placeholder="Nhập văn bản của bạn tại đây..."></textarea>
                
                <button id="clear-text-btn" title="Xóa toàn bộ văn bản" 
                    class="absolute top-4 right-4 text-ink/40 hover:text-clay p-2 rounded-xl transition-all duration-300 hover:-translate-y-1">
                    <i class="fa-solid fa-trash-can text-lg"></i>
                </button>
                
                <div id="char-counter" class="absolute bottom-4 right-5 font-mono text-xs md:text-sm text-ink/50 bg-white/80 px-2 py-1 rounded-lg backdrop-blur-sm">
                    0 / 15000
                </div>
            </div>
        </div>
    </main>

    <!-- Floating Bottom Control Bar -->
    <footer class="fixed bottom-0 left-0 w-full md:bottom-6 md:left-1/2 md:-translate-x-1/2 md:w-auto md:max-w-4xl z-40 px-4 md:px-0 pb-4 md:pb-0">
        <div id="ios-guide" class="hidden p-3 mb-2 bg-blue-50 border border-blue-200 text-sm text-blue-800 rounded-2xl shadow-sm"></div>
        
        <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-float border border-paper p-3 flex flex-col md:flex-row items-center gap-4 transition-all duration-300">
            
            <!-- Player Section (Hidden by default) -->
            <div id="player-container" class="hidden w-full md:w-auto flex-1 flex items-center gap-3 p-2 bg-paper rounded-2xl">
                <audio id="audio-player" controls class="w-full h-10 outline-none"></audio>
                <button id="download-btn" title="Tải xuống" 
                    class="p-3 bg-clay text-white rounded-xl shadow-sm hover:shadow-float hover:-translate-y-1 active:scale-95 transition-all duration-300 flex-shrink-0">
                    <i class="fa-solid fa-download"></i>
                </button>
            </div>

            <!-- Controls Section -->
            <div class="flex items-center justify-between md:justify-center w-full md:w-auto gap-2 md:gap-4 px-2">
                
                <!-- Voice Select -->
                <button id="open-voice-modal-btn" class="flex flex-col items-center justify-center py-2 px-3 rounded-2xl hover:bg-paper text-ink transition-all duration-300 min-w-[72px]">
                    <i class="fa-solid fa-user-pen text-xl mb-1 text-clay"></i>
                    <span id="selected-voice-name" class="text-[11px] font-semibold uppercase tracking-wider">Kore</span>
                </button>

                <!-- Optimize Text -->
                <button id="optimize-button" title="Tối ưu hóa văn bản" 
                    class="flex items-center justify-center h-12 w-12 bg-paper text-ink rounded-full shadow-sm hover:bg-clay hover:text-white transition-all duration-300 hover:-translate-y-1">
                    <i id="optimize-icon" class="fa-solid fa-magic-wand-sparkles"></i>
                    <div id="optimize-loader" class="loader hidden"></div>
                </button>

                <!-- Generate Play (Primary CTA) -->
                <button id="generate-button" 
                    class="flex items-center justify-center h-16 w-16 bg-clay text-white rounded-full shadow-float hover:-translate-y-1 active:scale-95 transition-all duration-300 relative group">
                    <i id="generate-icon" class="fa-solid fa-play text-2xl ml-1 group-hover:scale-110 transition-transform duration-300"></i>
                    <div id="generate-loader" class="loader hidden border-white/30 border-t-white"></div>
                </button>

                <!-- Speed Adjust -->
                <button id="open-speed-modal-btn" class="flex flex-col items-center justify-center py-2 px-3 rounded-2xl hover:bg-paper text-ink transition-all duration-300 min-w-[72px]">
                    <i class="fa-solid fa-gauge-high text-xl mb-1 text-clay"></i>
                    <span id="speed-value-display" class="font-mono text-[11px] font-semibold">1.0x</span>
                </button>
            </div>
        </div>
    </footer>
    
    <!-- Voice Selection Modal -->
    <div id="voice-modal" class="fixed inset-0 bg-ink/40 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50 transition-all duration-300 opacity-100">
        <div class="bg-white rounded-3xl shadow-float w-full max-w-md max-h-[85vh] flex flex-col overflow-hidden transform transition-all duration-300 scale-100">
            <div class="flex items-center justify-between p-5 border-b border-paper">
                <h2 class="text-lg font-bold text-ink">Chọn giọng đọc</h2>
                <button id="close-voice-modal-btn" class="p-2 rounded-full text-ink/50 hover:text-clay hover:bg-paper transition-all duration-300 hover:rotate-90">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div id="voice-list" class="p-4 space-y-2 overflow-y-auto"></div>
        </div>
    </div>

    <!-- Speed Adjustment Modal -->
    <div id="speed-modal" class="fixed inset-0 bg-ink/40 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50 transition-all duration-300">
        <div class="bg-white rounded-3xl shadow-float w-full max-w-sm overflow-hidden">
            <div class="flex items-center justify-between p-5 border-b border-paper">
                <h2 class="text-lg font-bold text-ink">Tốc độ đọc</h2>
                <span id="speed-modal-value" class="font-mono font-bold text-clay bg-paper px-3 py-1 rounded-lg">1.0x</span>
            </div>
            <div class="p-8">
                <input type="range" id="speed-slider" min="0.5" max="2.0" value="1.0" step="0.1" class="w-full h-2">
                <div class="flex justify-between text-xs font-mono text-ink/50 mt-4">
                    <span>0.5x</span>
                    <span>1.0x</span>
                    <span>2.0x</span>
                </div>
            </div>
            <div class="p-4 bg-paper/50 flex justify-end">
                <button id="confirm-speed-btn" class="bg-clay text-white font-medium py-2.5 px-8 rounded-2xl shadow-float hover:-translate-y-1 active:scale-95 transition-all duration-300">
                    Xác nhận
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT (Logic giữ nguyên, chỉ cập nhật class UI tạo bằng JS) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const MAX_CHARS = 15000;
            const voices = [
                { id: 'Kore', name: 'Kore', description: 'Giọng nữ, trang trọng', gender: 'female' },
                { id: 'Puck', name: 'Puck', description: 'Giọng nam, vui vẻ', gender: 'male' },
                { id: 'Charon', name: 'Charon', description: 'Giọng nam, truyền cảm', gender: 'male' },
                { id: 'Alnilam', name: 'Alnilam', description: 'Giọng nam, chắc chắn', gender: 'male' },
                { id: 'Zephyr', name: 'Zephyr', description: 'Giọng nữ, tươi sáng', gender: 'female' },
                { id: 'Leda', name: 'Leda', description: 'Giọng nữ, trẻ trung', gender: 'female' },
                { id: 'Aoede', name: 'Aoede', description: 'Giọng nữ, nhẹ nhàng', gender: 'female' },
                { id: 'Schedar', name: 'Schedar', description: 'Giọng nam, điềm đạm', gender: 'male' }
            ];
            let selectedVoiceId = voices[0].id;
            let generatedAudioBlob = null;
            let currentAudioFileId = null;
            let currentSpeed = 1.0;

            const textInput = document.getElementById('text-input');
            const charCounter = document.getElementById('char-counter');
            const generateButton = document.getElementById('generate-button');
            const generateIcon = document.getElementById('generate-icon');
            const generateLoader = document.getElementById('generate-loader');
            const downloadBtn = document.getElementById('download-btn');
            const audioPlayer = document.getElementById('audio-player');
            const playerContainer = document.getElementById('player-container');
            const clearTextBtn = document.getElementById('clear-text-btn');
            const voiceModal = document.getElementById('voice-modal');
            const openVoiceModalBtn = document.getElementById('open-voice-modal-btn');
            const closeVoiceModalBtn = document.getElementById('close-voice-modal-btn');
            const voiceListContainer = document.getElementById('voice-list');
            const selectedVoiceNameSpan = document.getElementById('selected-voice-name');
            const speedModal = document.getElementById('speed-modal');
            const openSpeedModalBtn = document.getElementById('open-speed-modal-btn');
            const confirmSpeedBtn = document.getElementById('confirm-speed-btn');
            const speedSlider = document.getElementById('speed-slider');
            const speedModalValue = document.getElementById('speed-modal-value');
            const speedValueDisplay = document.getElementById('speed-value-display');
            const errorContainer = document.getElementById('error-container');
            const errorMessage = document.getElementById('error-message');
            const optimizeButton = document.getElementById('optimize-button');
            const optimizeIcon = document.getElementById('optimize-icon');
            const optimizeLoader = document.getElementById('optimize-loader');

            const base64ToArrayBuffer = (base64) => { const binaryString = window.atob(base64); const len = binaryString.length; const bytes = new Uint8Array(len); for (let i = 0; i < len; i++) { bytes[i] = binaryString.charCodeAt(i); } return bytes.buffer; };
            const pcmToWav = (pcmData, sampleRate) => { const numChannels = 1, bitsPerSample = 16; const blockAlign = (numChannels * bitsPerSample) / 8; const byteRate = sampleRate * blockAlign; const dataSize = pcmData.length * (bitsPerSample / 8); const buffer = new ArrayBuffer(44 + dataSize); const view = new DataView(buffer); const writeString = (view, offset, string) => { for (let i = 0; i < string.length; i++) { view.setUint8(offset + i, string.charCodeAt(i)); } }; writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + dataSize, true); writeString(view, 8, 'WAVE'); writeString(view, 12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, numChannels, true); view.setUint32(24, sampleRate, true); view.setUint32(28, byteRate, true); view.setUint16(32, blockAlign, true); view.setUint16(34, bitsPerSample, true); writeString(view, 36, 'data'); view.setUint32(40, dataSize, true); let offset = 44; for (let i = 0; i < pcmData.length; i++, offset += 2) { view.setInt16(offset, pcmData[i], true); } return new Blob([view], { type: 'audio/wav' }); };
            
            const showError = (message) => { 
                if (message) { 
                    let displayMessage = message; 
                    const lowerCaseMessage = message.toLowerCase(); 
                    if (lowerCaseMessage.includes('quota')) { 
                        displayMessage = "Bạn đã dùng hết lượt miễn phí. Vui lòng thử lại sau."; 
                    } else if (lowerCaseMessage.includes('504') || lowerCaseMessage.includes('timeout')) { 
                        displayMessage = "Yêu cầu xử lý quá lâu. Vui lòng thử lại với đoạn văn ngắn hơn."; 
                    } 
                    errorMessage.textContent = displayMessage; 
                    errorContainer.classList.remove('hidden'); 
                } else { 
                    errorContainer.classList.add('hidden'); 
                } 
            };
            
            const toggleLoading = (isLoading, context = 'generate') => { 
                if (context === 'generate') { 
                    generateIcon.classList.toggle('hidden', isLoading); 
                    generateLoader.classList.toggle('hidden', !isLoading); 
                    generateButton.disabled = isLoading; 
                } else if (context === 'optimize') { 
                    optimizeIcon.classList.toggle('hidden', isLoading); 
                    optimizeLoader.classList.toggle('hidden', !isLoading); 
                    optimizeButton.disabled = isLoading; 
                } 
            };
            
            const updateCharCounter = () => { 
                const count = textInput.value.length; 
                charCounter.textContent = `${count} / ${MAX_CHARS}`; 
                if (count >= MAX_CHARS) { 
                    charCounter.classList.add('text-clay', 'font-bold'); 
                } else { 
                    charCounter.classList.remove('text-clay', 'font-bold'); 
                } 
            };
            
            // Cập nhật class HTML sinh ra bằng JS chuẩn Design System
            const createVoiceList = () => { 
                voiceListContainer.innerHTML = ''; 
                voices.forEach(voice => { 
                    const isSelected = voice.id === selectedVoiceId; 
                    const voiceElement = document.createElement('div'); 
                    voiceElement.className = `flex items-center justify-between p-4 rounded-2xl cursor-pointer transition-all duration-300 border border-transparent ${isSelected ? 'bg-paper border-clay shadow-sm ring-1 ring-clay/20' : 'bg-white hover:bg-paper'}`; 
                    voiceElement.dataset.voiceId = voice.id; 
                    voiceElement.innerHTML = `<div class="flex items-center flex-grow"><i class="fa-solid ${voice.gender === 'male' ? 'fa-mars' : 'fa-venus'} text-ink/40 w-8 text-lg text-center"></i><div><div class="font-semibold ${isSelected ? 'text-clay' : 'text-ink'}">${voice.name}</div><div class="text-xs text-ink/60 mt-0.5">${voice.description}</div></div></div><div class="w-5 text-center">${isSelected ? '<i class="fa-solid fa-circle-check text-clay text-lg"></i>' : ''}</div>`; 
                    voiceListContainer.appendChild(voiceElement); 
                }); 
            };

            const callSpeechAPI = async (text, voiceId, rate) => { 
                const maxRetries = 3; 
                const retryDelay = 2000; 
                for (let i = 0; i < maxRetries; i++) { 
                    try { 
                        const response = await fetch('/api/generate-speech', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, voice: voiceId, rate }) }); 
                        const responseText = await response.text(); 
                        if (!response.ok) { 
                            try { const errorJson = JSON.parse(responseText); throw new Error(errorJson.error || responseText); } 
                            catch (e) { throw new Error(responseText || `Lỗi từ server: ${response.status} ${response.statusText}`); } 
                        } 
                        if (!responseText) { throw new Error("EMPTY_RESPONSE"); } 
                        try { return JSON.parse(responseText); } 
                        catch (e) { throw new Error("Phản hồi thành công nhưng không phải định dạng JSON hợp lệ."); } 
                    } catch (error) { 
                        if (error.message === "EMPTY_RESPONSE" && i < maxRetries - 1) { 
                            await new Promise(resolve => setTimeout(resolve, retryDelay)); 
                        } else { throw error; } 
                    } 
                } 
            };

            const handleGenerateSpeech = async () => { 
                const text = textInput.value.trim(); 
                if (!text) { showError("Vui lòng nhập văn bản."); return; } 
                showError(null); toggleLoading(true); 
                playerContainer.classList.add('hidden'); 
                generatedAudioBlob = null; currentAudioFileId = null;

                try { 
                    const { audioContent, sampleRate, fileId } = await callSpeechAPI(text, selectedVoiceId, currentSpeed); 
                    if (audioContent && sampleRate && fileId) { 
                        currentAudioFileId = fileId; 
                        const pcmBuffer = base64ToArrayBuffer(audioContent); 
                        const pcm16 = new Int16Array(pcmBuffer); 
                        generatedAudioBlob = pcmToWav(pcm16, sampleRate); 
                        const audioUrl = URL.createObjectURL(generatedAudioBlob); 
                        playerContainer.classList.remove('hidden'); 
                        audioPlayer.src = audioUrl; 
                        audioPlayer.play(); 
                    } else { throw new Error("Dữ liệu âm thanh hoặc File ID không hợp lệ."); } 
                } catch (error) { showError(error.message); } 
                finally { toggleLoading(false); } 
            };

            const handleDownload = () => {
                document.getElementById('ios-guide').classList.add('hidden');
                if (!currentAudioFileId) {
                    alert("Chưa có tệp âm thanh để tải. Vui lòng tạo giọng đọc trước.");
                    return;
                }
                window.location.href = `/api/download?fileId=${currentAudioFileId}`;
            };

            const handleOptimizeText = async () => {
                const text = textInput.value.trim();
                if (!text) { showError("Vui lòng nhập văn bản để tối ưu hóa."); return; }
                showError(null); toggleLoading(true, 'optimize');
                try {
                    const response = await fetch('/api/optimize-text', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text })
                    });
                    const data = await response.json();
                    if (!response.ok || !data.success) { throw new Error(data.error || "Lỗi không xác định khi tối ưu hóa."); }
                    textInput.value = data.optimizedText;
                    updateCharCounter();
                } catch (error) { showError(error.message); } 
                finally { toggleLoading(false, 'optimize'); }
            };

            textInput.addEventListener('input', updateCharCounter);
            generateButton.addEventListener('click', handleGenerateSpeech);
            downloadBtn.addEventListener('click', handleDownload);
            clearTextBtn.addEventListener('click', () => { textInput.value = ''; updateCharCounter(); textInput.focus(); });
            optimizeButton.addEventListener('click', handleOptimizeText);

            openVoiceModalBtn.addEventListener('click', () => { createVoiceList(); voiceModal.classList.remove('hidden'); });
            closeVoiceModalBtn.addEventListener('click', () => voiceModal.classList.add('hidden'));
            voiceModal.addEventListener('click', (e) => { if (e.target === voiceModal) { voiceModal.classList.add('hidden'); } });
            
            voiceListContainer.addEventListener('click', (e) => { 
                const voiceItem = e.target.closest('[data-voice-id]'); 
                if (voiceItem) { 
                    selectedVoiceId = voiceItem.dataset.voiceId; 
                    selectedVoiceNameSpan.textContent = voices.find(v => v.id === selectedVoiceId).name; 
                    createVoiceList(); 
                    setTimeout(() => voiceModal.classList.add('hidden'), 200); 
                } 
            });
            
            openSpeedModalBtn.addEventListener('click', () => speedModal.classList.remove('hidden'));
            confirmSpeedBtn.addEventListener('click', () => speedModal.classList.add('hidden'));
            speedModal.addEventListener('click', (e) => { if (e.target === speedModal) { speedModal.classList.add('hidden'); } });
            
            speedSlider.addEventListener('input', (e) => { 
                currentSpeed = parseFloat(e.target.value); 
                const speedText = `${currentSpeed.toFixed(1)}x`; 
                speedModalValue.textContent = speedText; 
                speedValueDisplay.textContent = speedText; 
                audioPlayer.playbackRate = currentSpeed; 
            });

            updateCharCounter();
            createVoiceList();
            selectedVoiceNameSpan.textContent = voices[0].name;
        });
    </script>
</body>
</html>
